<!DOCTYPE html>
<html lang = "en">
    <head>
<title>color theory boxes</title>
        <meta charset="UTF-8">
		<style>
            .firstbox{
                width: 250px;
                height: 250px;
                background-color:rgb(183, 0, 255);
                border-radius: 10px;
                border: solid 15px #ffe100;
            }
         .box2{
                width: 250px;
                height: 250px;
                background-color:rgb(51, 179, 25);
                border-radius: 10px;
                border: solid 15px #ffec5b;
            }
         .box3{
                width: 250px;
                height: 250px;
                background-color:rgba(255, 189, 9, 0.849);
                border-radius: 10px;
                border: solid 15px #b045c5fa;
                color:#07ba25;
            }

        
		</style>
    </head>
<body>

<div class="firstbox">
    <h1>complementary</h1>
</div>
<hr>
<div class="box2">
    <h1>Analogous</h1>
</div>
<hr>

<div class="box3">
<h1>Triadic</h1>

</div>


</body>
</html>
